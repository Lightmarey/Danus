[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danus"
version = "0.1.0"
description = "Danus — automated mathematics proof-search orchestration engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bin Wu" }]
keywords = ["mathematics", "proof-search", "multi-agent", "llm", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The truth layer (danus.core) is pure standard library. Per-module third-party
# deps are declared as optional extras below and pulled in as each module lands
# (see ARCHITECTURE.md).
dependencies = []

[project.scripts]
danus = "danus.orchestration.cli:main"
danus-doctor = "danus.doctor:main"
danus-mcp = "danus.gateway.__main__:main"
danus-verify = "danus.verify.__main__:main"
danus-observability = "danus.observability.__main__:main"
write-paper-mcp = "danus.write_paper.__main__:main"
human-summary-mcp = "danus.human_summary.__main__:main"

[project.urls]
Repository = "https://github.com/frenzymath/Danus"

[project.optional-dependencies]
gateway = ["mcp"]                                   # danus.gateway — role-gated MCP server
write-paper = ["mcp"]                                     # danus.write_paper   — write-paper MCP service
human-summary = ["mcp"]                                   # danus.human_summary — human-summary MCP service
verify = ["fastapi", "uvicorn", "pydantic"]         # danus.verify  — cold-start verifier HTTP service
observability = ["fastapi", "uvicorn", "pydantic"]  # danus.observability — read-only dashboard
strategy = ["openai", "anthropic"]                  # danus.strategy — API consult transports
dev = ["pytest", "mcp", "fastapi", "uvicorn", "pydantic", "openai", "anthropic"]  # full test suite (all modules)

[dependency-groups]
dev = ["pytest", "mcp", "fastapi", "uvicorn", "pydantic", "openai", "anthropic"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["danus"]
norecursedirs = [".venv", ".uv-cache", "uvcache", "build", "dist", "*.egg-info"]

[tool.setuptools.packages.find]
include = ["danus*"]

[tool.setuptools.package-data]
"danus.core" = ["*.json"]
